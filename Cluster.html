  b=`<div class="c"><div style="margin-bottom:12px">${fs.map(f=>`<button class="btn ${f===S.tf?"pri":""}" style="margin-right:4px" onclick="S.tf='${f}';draw()">${f}</button>`).join("")}</div>${ev.length?`<div class="tl">${ev.map(e=>`<div class="${e[6]||""}"><b>${e[1]}</b><br><span style="color:var(--mu)">${e[0]} · ${e[3]} · ${e[4]} · Source: ${e[5]}</span></div>`).join("")}</div>`:`<span class="sim">No timeline events in the synthetic dataset for this customer. Open Rahul Mehta (C-004821) for the full timeline.</span>`}</div>`}
 else if(S.tab==="AI Insights"){const r=reco(c);b=`<div class="c"><h2>Simulated model output</h2><p>Suggested action: <b>${r.a}</b>. Open AI Decisioning for the full explanation and human review.</p><button class="btn pri" onclick="go('AI Decisioning',{sel:'${c.id}'})">Open decisioning</button></div>`}
 else b=`<div class="c"><span class="sim">“${S.tab}” tab is a placeholder in this prototype — see Overview and Timeline.</span></div>`;
 return head("Customer 360","Unified customer record assembled from golden Collections 360 data.","Customer 360 / "+c.id)+hd+`<div class="tabs">${tabs.map(t=>`<a class="${t===S.tab?"on":""}" onclick="S.tab='${t}';draw()">${t}</a>`).join("")}</div>`+b}
function send(q){q=q.trim();if(!q)return;S.chat.push({q,r:ask(q)});draw();v.scrollTop=v.scrollHeight}
function ai(){const ex=["Which customers are most likely to break a promise to pay?","Which strategy worked best for unsecured loans in the last 90 days?","What were the top drivers of roll-rate deterioration this week?","What is the weather today?"];
 return head("Ask Collections AI","Ask questions about curated and golden Collections data in plain English.")+
 `<div class="c mb"><input class="ti" id="qi" placeholder="Ask a question…" onkeydown="if(event.key==='Enter')send(this.value)"><div style="margin-top:8px">${ex.map(e=>`<span class="chip" style="cursor:pointer" onclick="send(this.textContent)">${e}</span>`).join("")}</div><div class="sim" style="margin-top:6px">Simulated: keyword-matched canned responses. SQL is illustrative and not executed.</div></div>`+
 S.chat.map((m,i)=>`<div class="q">${m.q}</div>`+(m.r.refuse?`<div class="c"><b>I can only answer questions using the available Collections data products.</b><div class="sim" style="margin-top:4px">Request refused: outside the permitted data scope. Nothing was queried.</div></div>`:`<div class="c mb"><h2>1 · Understanding (editable)</h2>${m.r.u.map(t=>`<span class="chip">${t[0]}: <b contenteditable>${t[1]}</b></span>`).join("")}<h2 style="margin-top:12px">2 · Answer <span class="sim">· AI-generated (simulated)</span></h2><p style="margin:4px 0 8px">${m.r.ans}</p><table>${m.r.tbl.map((r,j)=>"<tr>"+r.map(x=>j?"<td>"+x+"</td>":"<th>"+x+"</th>").join("")+"</tr>").join("")}</table>
 <details style="margin-top:10px"><summary>3 · View SQL</summary><pre>${m.r.sql}</pre></details><h2 style="margin-top:12px">4 · Data products used</h2>${m.r.dp.map(d=>`<span class="chip">${d}</span>`).join("")}<h2 style="margin-top:12px">5 · Data quality</h2><span class="chip">${m.r.dq}</span><h2 style="margin-top:12px">6 · Follow-ups</h2>${m.r.fu.map(f=>`<a class="fu" onclick="send(this.textContent)">${f}</a>`).join("")}${m.r.act?`<button class="btn pri" style="margin-top:8px" onclick="go('AI Decisioning',{sel:'C-004821'})">Generate next best action →</button>`:""}</div>`)).join("")}
function dec(){const c=cust(S.sel),r=reco(c),rv=S.rev[c.id];
 return head("AI Decisioning","Turn customer context into an explainable recommended action.")+
 `<div class="mb"><select onchange="S.sel=this.value;draw()">${C.map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${x.n} · ${x.id}</option>`).join("")}</select></div>
 <div class="g g2 mb"><div class="c"><h2>Customer context</h2><dl class="kv"><dt>DPD</dt><dd>${c.dpd}</dd><dt>Outstanding</dt><dd>${inr(c.out)}</dd><dt>Payment history</dt><dd>${c.sal}</dd><dt>Previous promises</dt><dd>${c.made} made · ${c.brk} broken</dd><dt>Contact history</dt><dd>${c.cnt} contacts · ${c.last}</dd><dt>Preferred channel</dt><dd>${c.pref}</dd><dt>Risk</dt><dd>${pill(c.risk,cls(c.risk))}</dd></dl><div class="sim" style="margin-top:6px">Protected attributes are excluded from this model's inputs.</div></div>
 <div class="c"><h2>Recommended next best action · simulated</h2><b style="font-size:17px">${r.a}</b><dl class="kv" style="margin-top:8px"><dt>Channel</dt><dd>${c.ch}</dd><dt>Timing</dt><dd>${r.t}</dd><dt>Objective</dt><dd>${r.o}</dd><dt>Risk</dt><dd>${c.risk}</dd></dl></div></div>
 <div class="g g2 mb"><div class="c"><h2>Why this recommendation?</h2>${r.why.map(w=>`<div class="why ${w[0]==="~"?"warn":""}">${w[0]} ${w[1]}</div>`).join("")}</div><div class="c"><h2>Alternative actions</h2>${r.alts.map(a=>`<div style="margin:6px 0"><b>${a[0]}</b><br><span style="color:var(--mu)">${a[1]}</span></div>`).join("")}</div></div>
 <div class="c" style="border-color:var(--am)"><h2>Human review required</h2>${rv?`<div class="why"><b>${rv.s}</b> by Collections Agent at ${rv.t}. Logged to audit trail (simulated).${rv.m?"<br>Modified to: "+rv.m:""}</div>`:`<button class="btn ok" onclick="rev('Approved')">Approve Recommendation</button> <button class="btn" onclick="rev('Modified',prompt('Modify action to:','Email reminder'))">Modify</button> <button class="btn no" onclick="rev('Rejected')">Reject</button>`}
 <div class="sim" style="margin-top:8px">Decision owner: Collections Agent · AI recommendation does not automatically affect the customer.</div></div>`}
function rev(s,m){if(s==="Modified"&&!m)return;S.rev[S.sel]={s,m,t:new Date().toLocaleTimeString()};draw()}
function dprod(){const d=DP.find(x=>x[0]===S.dp);return head("Data Product Factory","Raw → curated → golden → feature-ready. Click a layer or product.")+
 `<div class="pipe mb">${LAYERS.map((l,i)=>(i?'<span class="ar">→</span>':"")+`<div class="c ${i===S.lay?"on":""}" onclick="S.lay=${i};draw()"><b>${l[0]}</b><br>${l[1]} · ${l[2]} records<br><span style="color:var(--mu)">Refresh ${l[3]} · Quality ${l[4]}</span><br>${pill(l[5],sc(l[5]))}</div>`).join("")}</div>
 <div class="g g2"><div class="c"><h2>Data products</h2>${DP.map(x=>`<div class="row"><a class="chip" style="cursor:pointer;${x[0]===S.dp?"border-color:var(--ac)":""}" onclick="S.dp='${x[0]}';draw()">${x[0]}</a>${pill(x[6],sc(x[6]))}</div>`).join("")}</div>
 <div class="c"><h2>${d[0]} · metadata</h2><dl class="kv"><dt>Owner</dt><dd>Collections Data Office</dd><dt>Schema</dt><dd>${d[0].toLowerCase().replace(/ /g,"_")} (v1.3)</dd><dt>Refresh</dt><dd>Every 15 min – daily</dd><dt>Quality rules</dt><dd>Unique ID · non-null keys · freshness SLA</dd><dt>Allowed uses</dt><dd>Collections analytics, decision support</dd><dt>Last updated</dt><dd>${d[5]} ago</dd></dl><div class="sim" style="margin-top:8px">Lineage: ${LIN[d[0]]||LIN.Default}</div></div></div>`}
function dqual(){const f=["All","Healthy","Warning","Critical"],rows=DP.filter(x=>S.dq==="All"||x[6]===S.dq);
 return head("Data Quality","Synthetic quality metrics across Collections datasets.")+
 `<div class="g g5 mb"><div class="c k"><span>Overall quality</span><b>96.4%</b></div>${[["Completeness","97.0%"],["Accuracy","95.8%"],["Consistency","96.1%"],["Timeliness","94.9%"],["Uniqueness","99.3%"]].map(m=>`<div class="c k"><span>${m[0]}</span><b>${m[1]}</b></div>`).join("")}</div>
 <div class="g g2"><div class="c"><div style="margin-bottom:8px">${f.map(x=>`<button class="btn ${x===S.dq?"pri":""}" style="margin-right:4px" onclick="S.dq='${x}';draw()">${x}</button>`).join("")}</div><table><tr><th>Dataset</th><th>Records</th><th>Complete</th><th>Dupes</th><th>Missing</th><th>Fresh</th><th>Status</th></tr>${rows.map(r=>"<tr>"+r.slice(0,6).map(x=>"<td>"+x+"</td>").join("")+"<td>"+pill(r[6],sc(r[6]))+"</td></tr>").join("")}</table></div>
 <div class="c"><h2>Alerts</h2>${[["Duplicate customer IDs detected","Collections Cases · 0.9%","A"],["Schema change detected in contact_history","Column 'outcome_code' type changed","A"],["Missing values increased in loan_accounts","3.1% → 4.8% in 7 days","A"],["Agent notes freshness SLA breached","1 h 5 min vs 30 min SLA","R"]].map(a=>`<div class="why ${a[2]==="A"?"warn":""}" style="${a[2]==="R"?"border-color:var(--rd)":""}"><b>${a[0]}</b><br><span style="color:var(--mu)">${a[1]}</span> · <a class="fu" style="display:inline" onclick="alert('Demo only: affected-record list not implemented.')">View affected records</a></div>`).join("")}</div></div>`}
// search
cl.innerHTML=C.map(c=>`<option value="${c.id}">${c.n}</option>`).join("");
gs.onkeydown=e=>{if(e.key==="Enter"){const q=gs.value.trim().toLowerCase(),c=C.find(x=>x.id.toLowerCase()===q||x.n.toLowerCase().includes(q));if(c){S.tab="Overview";go("Customer 360",{cid:c.id});gs.value=""}else gs.style.borderColor="#b91c1c"}};
draw();
</script></body></html>
